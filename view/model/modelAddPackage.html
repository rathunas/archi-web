<!DOCTYPE html>
<html lang="en">

<head>
    <meta
        http-equiv="Content-Language"
        content="en"
    >

    <title id="title">Add Model Design Package</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

    <link
        rel="stylesheet"
        href="/static/model/model.css"
    >

    <script
        type="module"
        src="/static/components/AppNavbar.mjs"
    ></script>

    <script
        type="module"
        src="/static/model/modelAddPackage.mjs"
    ></script>

</head>

<body>

    <span style="display:none">This page is in English.</span>

    <app-navbar current="Add">
        <a href="/">Home</a>
        <a href="/model">Models</a>
    </app-navbar>

    <div class="container">

        <form
            id="form-add"
            novalidate
        >

            <div class="row">

                <label
                    class="right-label"
                    for="package-name-input"
                >Design Package</label>

                <div class="left-field">

                    <input
                        id="package-name-input"
                        type="text"
                        placeholder="New package name"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        inputmode="text"
                        required
                    >

                    <button
                        id="save-button"
                        class="primary disabled"
                        disabled
                    >Save</button>

                </div>

            </div>

        </form>

    </div>

</body>

</html>
