<!DOCTYPE html>
<html lang="en">

<head>
    <meta
        http-equiv="Content-Language"
        content="en"
    >

    <title id="title">View Model Design Package Version</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >
    <link
        rel="stylesheet"
        href="/static/css/data-table.css"
    >
    <link
        rel="stylesheet"
        href="/static/model/model.css"
    >

    <script
        id="data"
        type="application/json"
    >${JSON.stringify(data)}</script>

    <script
        type="module"
        src="/static/components/AppNavbar.mjs"
    ></script>

    <script
        type="module"
        src="/static/components/AppDataTable.mjs"
    ></script>

    <script
        type="module"
        src="/static/model/modelShowVersion.mjs"
    ></script>

</head>

<body>

    <span style="display:none">This page is in English.</span>

    <app-navbar id="navbar">
        <a href="/">Home</a>
        <a href="/model">Models</a>
        <a id="navbar-package-name-link"></a>
    </app-navbar>

    <div class="container">

        <div class="row">
            <label
                id="package-name-label"
                class="right-label"
            >Package Name</label>
            <div class="left-field">
                <span
                    id="package-name"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- Version date + Rename button row -->
        <div class="row">

            <label
                id="version-date-label"
                class="right-label"
            >Version Date</label>

            <div class="left-field">
                <input
                    id="version-date-input"
                    type="datetime-local"
                    step="1"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                >

                <button
                    id="rename-button"
                    class="primary disabled"
                    disabled
                >Rename</button>

            </div>

        </div>

        <br>

        <div class="row">
            <label class="right-label">Request ID</label>
            <div class="left-field">
                <span
                    id="request-id"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Submitted Date</label>
            <div class="left-field">
                <span
                    id="submitted-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        </br>

        <div class="row">
            <label class="right-label">Original File</label>
            <div class="left-field">
                <span
                    id="filename"
                    class="field-info"
                ></span>
            </div>
        </div>

        </br>

        <div class="row">
            <label class="right-label">Completed Date</label>
            <div class="left-field">
                <span
                    id="completed-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- Attempts -->
        <div class="row">
            <label class="right-label">Job Run Count</label>
            <div class="left-field">
                <span
                    id="job-attempts"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- Error -->
        <div class="row">
            <label class="right-label">Errors</label>
            <div class="left-field">
                <span
                    id="job-errors"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- ------------------------------------------------------------ -->
        <!-- Step 1 - Unzip Archimate File -->
        <!-- ------------------------------------------------------------ -->
        <h3 class="step-title"><a
                id="step-1-link"
                href="#"
            >Job Step 1 — Unzip Archimate File</a></h3>

        <div class="row">
            <label class="right-label">Start</label>
            <div class="left-field">
                <span
                    id="unzip-start-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Stop</label>
            <div class="left-field">
                <span
                    id="unzip-stop-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Duration (s)</label>
            <div class="left-field">
                <span
                    id="unzip-duration"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- ------------------------------------------------------------ -->
        <!-- Step 2 - Generate HTML Report -->
        <!-- ------------------------------------------------------------ -->
        <h3 class="step-title"><a
                id="step-2-link"
                href="#"
            >Job Step 2 — Generate HTML Report</a></h3>

        <div class="row">
            <label class="right-label">Start</label>
            <div class="left-field">
                <span
                    id="report-start-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Stop</label>
            <div class="left-field">
                <span
                    id="report-stop-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Duration (s)</label>
            <div class="left-field">
                <span
                    id="report-duration"
                    class="field-info"
                ></span>
            </div>
        </div>

        <!-- ------------------------------------------------------------ -->
        <!-- Step 3 - Move To Model Folder -->
        <!-- ------------------------------------------------------------ -->
        <h3 class="step-title">Job Step 3 — Move To Model Folder</h3>

        <div class="row">
            <label class="right-label">Start</label>
            <div class="left-field">
                <span
                    id="move-start-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Stop</label>
            <div class="left-field">
                <span
                    id="move-stop-date"
                    class="field-info"
                ></span>
            </div>
        </div>

        <div class="row">
            <label class="right-label">Duration (s)</label>
            <div class="left-field">
                <span
                    id="move-duration"
                    class="field-info"
                ></span>
            </div>
        </div>

    </div>

    <app-data-table
        id="list"
        style="display: none;"
    >

        <div
            id="error-attempt"
            data-sortable
        >
            Error
        </div>

        <div
            id="error-date"
            data-sortable
        >
            Date
        </div>

        <div
            id="error-message"
            data-sortable
        >
            Message
        </div>

    </app-data-table>

</body>

</html>
